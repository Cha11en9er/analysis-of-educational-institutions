# uchgrad.ru — УчГрад (карта школ Саратова)
# ПОЛНАЯ версия для /etc/nginx/sites-available/uchgrad.ru (включая 443 ssl).
# ВНИМАНИЕ: это не «фрагмент для certbot» — блок 443 уже включён.

# HTTP -> HTTPS
server {
    listen 80;
    server_name uchgrad.ru www.uchgrad.ru;
    return 301 https://uchgrad.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name uchgrad.ru www.uchgrad.ru;

    ssl_certificate /etc/letsencrypt/live/uchgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uchgrad.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/uchgrad/UI/build;
    index index.html;

    # API -> uvicorn 127.0.0.1:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api { return 301 /api/; }

    # index.html не кэшировать (иначе браузер мешает старый и новый билды)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Хешированная статика CRA - кэш на год
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /favicon.svg {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
