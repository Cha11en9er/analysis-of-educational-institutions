# Фрагмент для /etc/nginx/sites-available/uchgrad.ru
# certbot сам добавит listen 443 ssl и пути к сертификатам.

server {
    listen 80;
    server_name uchgrad.ru www.uchgrad.ru;

    root /opt/uchgrad/UI/build;
    index index.html;

    # API → uvicorn на 127.0.0.1:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        return 301 /api/;
    }

    # index.html — никогда не кэшировать, иначе браузер мешает старый и новый билды
    location = /index.html {
        root /opt/uchgrad/UI/build;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    # Хешированная статика CRA — кэш на год
    location /static/ {
        root /opt/uchgrad/UI/build;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
