# uchgrad.ru — УчГрад (карта школ Саратова)
# ПОЛНАЯ версия для /etc/nginx/sites-available/uchgrad.ru (включая 443 ssl).
# ВНИМАНИЕ: это не «фрагмент для certbot» — блок 443 уже включён.

# HTTP -> HTTPS
server {
    listen 80;
    server_name uchgrad.ru www.uchgrad.ru;
    return 301 https://uchgrad.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name uchgrad.ru www.uchgrad.ru;

    ssl_certificate /etc/letsencrypt/live/uchgrad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uchgrad.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/uchgrad/UI/build;
    index index.html;

    # Сжатие JSON/статики (наплыв пользователей: меньше трафика на клиента)
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # Мягкий лимит на /api/: не для честных пользователей, а от скрейперов и DDoS
    limit_req_zone $binary_remote_addr zone=uchgrad_api:10m rate=30r/s;

    # API -> uvicorn 127.0.0.1:8000 (кэш внутри API отдаёт X-Cache)
    location /api/ {
        limit_req zone=uchgrad_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        add_header Cache-Control "no-store" always;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api { return 301 /api/; }

    # index.html не кэшировать (иначе браузер мешает старый и новый билды)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Хешированная статика CRA - кэш на год
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Фото заведений: кэш браузера на неделю (наплыв: повторные визиты без скачивания)
    location /images/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location /favicon.svg {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
